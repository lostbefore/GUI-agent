[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-gui-agent"
version = "1.0.0"
description = "Multimodal desktop GUI agent prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "easyocr>=1.7.1",
  "numpy>=1.24",
  "opencv-python>=4.8",
  "Pillow>=10",
  "PyAutoGUI>=0.9.54",
  "pyperclip>=1.9",
  "PyQt5>=5.15",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=7",
  "pytest-html>=4",
  "ruff>=0.5",
]
agent = [
  "accelerate>=1",
  "bitsandbytes>=0.49",
  "langchain-core>=0.3,<2",
  "qwen-vl-utils>=0.0.14",
  "transformers>=4.49",
  "torch>=2.2",
]
datasets = [
  "datasets>=3,<5",
  "huggingface-hub>=0.27",
]

[project.scripts]
gui-agent = "gui_agent.cli:main"
gui-agent-data = "gui_agent.datasets.cli:main"
gui-agent-run = "gui_agent.agent.cli:main"
gui-agent-v1 = "gui_agent.runtime.cli:main"
gui-agent-acceptance = "gui_agent.runtime.acceptance:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
